<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="graph" width="400" height="400"></canvas>
    <script>
        const c = document.getElementById("graph");
        const ctx = c.getContext("2d");

        const a = 2; // Hældningskoefficient, Slope
        const b = 0; // Skæringspunkt med Y-aksen, Intercept
        
        const originX = 0, originY = 400, scale = 40;
        //const points = [[1,2],[2,5],[3,3],[4,6],[5,4],[6,8],[7,5],[8,9]];
        const points = [];

        for(let i = 0; i < 10; i++) {
            let x = Math.random() * 400;
            let y = Math.random() * 400;
            let point = [x, y];
            points.push(point);
        }

        // Akser
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(400, originY);
        ctx.moveTo(originX, originY);
        ctx.lineTo(originX, 0);
        ctx.stroke();

        // Linje: y = ax + b
        ctx.beginPath();
        ctx.moveTo(originX, originY - b * scale);
        ctx.lineTo(10 * scale, originY - (a * 10 + b) * scale);
        ctx.stroke();

        // Tegn punkter
        // Hvis punkt er over eller på linjen, farv blå, ellers farv rød
        for (const [x, y] of points) {
            ctx.beginPath();
            ctx.arc(originX + x, originY - y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = y >= a * x + b ? "blue" : "red";
            ctx.fill();
        }
    </script>
</body>
</html>
