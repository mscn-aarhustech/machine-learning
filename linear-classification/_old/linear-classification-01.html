<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="graph" width="400" height="400"></canvas>
    <script>
        const c = document.getElementById("graph");
        const ctx = c.getContext("2d");
        const a = 0.0, b = 4.5;
        const points = [[1,2],[2,5],[3,3],[4,6],[5,4],[6,8],[7,5],[8,9]];

        const px = x => x * 40;
        const py = y => 400 - y * 40;

        // Axes
        ctx.beginPath();
        ctx.moveTo(px(0), py(0));
        ctx.lineTo(px(10), py(0));
        ctx.moveTo(px(0), py(0));
        ctx.lineTo(px(0), py(10));
        ctx.stroke();

        // Decision boundary: y = ax + b
        ctx.beginPath();
        ctx.moveTo(px(0), py(b));
        ctx.lineTo(px(10), py(a * 10 + b));
        ctx.stroke();

        for (const [x, y] of points) {
            ctx.beginPath();
            ctx.arc(px(x), py(y), 6, 0, 2 * Math.PI);
            ctx.fillStyle = y >= a * x + b ? "blue" : "red";
            ctx.fill();
        }
    </script>
</body>
</html>
